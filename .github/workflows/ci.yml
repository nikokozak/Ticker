# Branch protection is a repository setting, not repo code. After this lands,
# require this workflow's jobs on main in GitHub branch protection settings.
#
# macOS intentionally does not cache DerivedData/SPM artifacts here. This app
# depends on binary SwiftPM artifacts, and stale DerivedData can leave incomplete
# XCFramework directories behind. npm uses setup-node caching below.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift-build-test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install Web dependencies
        working-directory: Web
        run: npm ci

      - name: Build Web assets
        working-directory: Web
        run: npm run build

      - name: Swift build
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          xcodebuild build \
            -project Ticker.xcodeproj \
            -scheme Ticker \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ci-xcode \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PRODUCT_BUNDLE_IDENTIFIER=io.ticker.next \
            INFOPLIST_KEY_CFBundleDisplayName="Ticker Next" \
            -quiet

      - name: Swift tests
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          xcodebuild test \
            -project Ticker.xcodeproj \
            -scheme Ticker \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ci-xcode \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -quiet

  web:
    name: web-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Web/package-lock.json
            tools/contracts/package-lock.json

      - name: Install Web dependencies
        working-directory: Web
        run: npm ci

      - name: Web typecheck
        working-directory: Web
        run: npm run typecheck

      - name: Web tests
        working-directory: Web
        run: npm test

      - name: Web build
        working-directory: Web
        run: npm run build

      - name: Install contract tooling dependencies
        working-directory: tools/contracts
        run: npm ci

      - name: Bridge contract check
        run: node tools/contracts/check_bridge_contract.mjs
